name: Bug
description: A defect found in the product under test.
title: '[BUG] '
labels: ['type:bug']
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, saucedemo user, and where it ran.
      placeholder: chromium, problem_user, CI run 42
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: run_url
    attributes:
      label: Run URL
      description: Link to the CI run or local report, if there is one.
  - type: input
    id: test_case
    attributes:
      label: Test case
      description: The test case issue that caught it, for example #5.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - p1 blocks the main flow
        - p2 important, not blocking
        - p3 minor
    validations:
      required: true
