name: E2E tests

# PRs and pushes to main run automatically. workflow_dispatch is the manual
# button in the Actions tab, used instead of a nightly schedule.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --with-deps installs the system libraries the browsers need. It works
      # here because the runner is Ubuntu; on Fedora it does not (see ADR 0001).
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
          SAUCE_LOCKED_OUT_USER: ${{ secrets.SAUCE_LOCKED_OUT_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      # Uploaded even on failure, because a failed run is when the report matters.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
